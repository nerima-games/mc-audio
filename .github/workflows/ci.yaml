name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, so the GITHUB_TOKEN should not remain
          # readable to any step after checkout (SUPPLY_CHAIN.md).
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a package.json
      # devDependency — see flake.nix's comment on why. Installing Nix just for
      # this one step is the org-wide trade-off (DEPENDENCY_POLICY.md §5
      # "前提条件"): one pinned oxlint version instead of 16 repos each
      # independently drifting on their own npm-resolved version.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # oxlint's no-restricted-imports (.oxlintrc.json) is the enforcement
      # mechanism for the Tier dependency policy (DEPENDENCY_POLICY.md §5).
      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: pnpm test

      # Separate required gate from `pnpm verify` (TEST_STANDARD.md §1/§3).
      # Enforces the org-wide 4-metric 99% threshold (statements/branches/
      # functions/lines) via vitest.config.ts#test.coverage.thresholds.
      #
      # KNOWN, ACCEPTED FAILURE: as of the 2026-08-01 rollout this repository
      # measures statements/branches/lines 95.52% and functions 84.12%
      # (53/63), below the 99% gate. Per org decision (TEST_STANDARD.md §3,
      # confirmed twice), the gate is enabled immediately and without a
      # staged rollout regardless; the shortfall is tracked as follow-up work
      # (TEST_STANDARD.md §4 "既知の非適合"), not a reason to disable or
      # relax the gate.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
